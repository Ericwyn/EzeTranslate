name: Build Multi-Platform Binaries

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: 0
            output_name: EzeTranslate-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cgo: 1
            output_name: EzeTranslate-darwin-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            cgo: 0
            output_name: EzeTranslate-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      # 使用 go.mod 中声明的 Go 版本（1.26+，Viva 要求）
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      # Viva 的 Linux/Windows 后端在运行时加载系统图形库，构建无需 cgo；
      # macOS 后端通过 cgo 调用 Cocoa/Metal，必须在 macOS runner 上原生构建。
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -trimpath -ldflags="-s -w" -o "${{ matrix.output_name }}" EzeTranslate.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.output_name }}

  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Download dependencies
        run: go mod download

      - name: Build deb package
        run: bash ./build-deb.sh

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: EzeTranslate-deb-amd64
          path: build-target/deb/*/*.deb

      - name: Upload deb release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build-target/deb/*/*.deb
